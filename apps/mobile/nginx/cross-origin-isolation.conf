# The two headers the web build's database cannot do without.
#
# `expo-sqlite` in a browser is SQLite compiled to WebAssembly, persisting
# through OPFS, and OPFS hands out the synchronous access handles it needs only
# to a cross-origin-isolated document. Without both of these the app still
# loads and still answers every query — from memory — so the whole training log
# is gone on reload, with nothing on screen to say so. Serving these is the most
# important thing this container does; everything else about it is ordinary
# static hosting.
#
# `credentialless` rather than `require-corp`: the stricter value would also
# demand CORP headers on every cross-origin subresource, and the exercise
# artwork is loaded from wherever the bundled catalog points. Matches what
# `metro.config.js` sends to `expo start --web`, so a built export behaves the
# way the dev server does.
#
# `always`, so they are sent with error responses too. A 404 that is not
# isolated would break nothing, but the header set should not depend on status.
#
# Included per location rather than set once at server level, because nginx's
# `add_header` *replaces* the inherited set rather than adding to it: any
# location that sets its own Cache-Control would otherwise silently drop these,
# which is the exact failure this file exists to prevent.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
