# Serves the static web export produced by `expo export --platform web`.
#
# Traefik terminates TLS and is the only thing that talks to this container, so
# there is no redirect, no certificate and no published port here.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The bundle is a few megabytes of JavaScript and the catalog is most of it.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/wasm
    image/svg+xml;

  # Everything under these two is content-hashed by Metro — `wa-sqlite.<hash>.wasm`,
  # `entry-<hash>.js` — so the name changes whenever the bytes do and the copy a
  # browser already has can never be the wrong one.
  location ~ ^/(_expo|assets)/ {
    include /etc/nginx/snippets/cross-origin-isolation.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/cross-origin-isolation.conf;
    # The document is never cached. It names the hashed bundle, so a stale copy
    # of it is a stale app for as long as the browser keeps it — and the file is
    # a few kilobytes against a bundle that is cached for a year.
    add_header Cache-Control "no-cache" always;

    # `$uri.html` is what makes the export's own routing work: it writes one
    # pre-rendered file per static route — `history.html`, `stats/index.html` —
    # rather than a single index.
    #
    # The last fallback is for the dynamic routes, which are exported as
    # `workout/[id].html` and cannot be matched from a request path. Serving the
    # root document instead is correct rather than a compromise: every one of
    # these files carries the same bundle, and expo-router reads the address bar
    # on hydration and renders the route it finds there. What is lost is the
    # pre-rendered first paint for those routes, on an app that is behind a
    # sign-in and indexed by nobody.
    try_files $uri $uri.html $uri/index.html /index.html;
  }
}
