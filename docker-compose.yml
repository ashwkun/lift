# Local development stack. Publishes both services on host ports, which is what
# you want on a laptop and never what you want on a server.
#
# Do not deploy this file. `docker-compose.dokploy.yml` is the production stack:
# same two services, nothing published, Traefik in front.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: lift
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API's own healthcheck depends on this being genuinely ready, not
      # merely started — Postgres accepts connections briefly during init.
      test: ['CMD-SHELL', 'pg_isready -U lift -d lift']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lift:${POSTGRES_PASSWORD:-password}@postgres:5432/lift
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # The phone scheme, Metro's web dev server, and the built web container
      # on 8080 below — a browser origin that is not listed here is rejected
      # before it reaches a handler.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-lift://,http://localhost:8081,http://localhost:8080}
      PORT: 3000
    ports:
      - '3000:3000'

  # Not started by `docker compose up` — `expo start --web` is how you develop
  # the web app, and it is faster and hot-reloads. This exists to check the one
  # thing that dev server cannot tell you: whether a *built* export is still
  # cross-origin isolated. Metro sends COOP and COEP through
  # `server.enhanceMiddleware`, which only `expo start` reads, so isolation is
  # the one property that is guaranteed in development and easy to lose in
  # production — and losing it costs the whole training log on the next reload,
  # silently. Run it before trusting a deploy:
  #
  #   docker compose --profile web up --build web
  #
  # then open http://localhost:8080 and check `crossOriginIsolated === true`.
  web:
    profiles: ['web']
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        # Baked into the bundle at build time; see the Dockerfile. The default
        # is the api service above, published on the same host.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - '8080:80'

volumes:
  postgres-data:
