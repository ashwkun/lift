# Production stack for Dokploy. Set the Compose Path to this file, not to
# docker-compose.yml — that one is the local development stack, and it brings
# its own Postgres and publishes both services on host ports.
#
# The database is Dokploy's own Postgres service, so it is not defined here.
# Paste the connection string that service gives you into DATABASE_URL and it
# is used as-is. Nothing is published: Traefik reaches both services over
# dokploy-network, which is also how the database hostname resolves.
#
# Three services means three domains in Dokploy:
#
#   api       port 3000
#   web       port 80
#   landing   port 3000   (its own container, so it does not clash with api)
#
# The first two have to know about each other:
#
#   EXPO_PUBLIC_API_URL   the API's public URL, baked into the web bundle
#   TRUSTED_ORIGINS       must include the web app's origin, or better-auth
#                         rejects every request the browser makes
#   BETTER_AUTH_URL       the API's own public URL, scheme included
#
# `landing` knows about neither. It is the marketing page: static apart from one
# hourly call to the GitHub releases API, it holds no data and talks to nothing
# in this stack. Its origin does **not** belong in TRUSTED_ORIGINS, because it
# never makes a request the API would have to trust.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Must match the domain exactly, scheme included — cookies and OAuth
      # callbacks are derived from it.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      # The phone app's scheme, and — once the web app is deployed — its origin
      # too: `lift://,https://app.example.com`. A browser request from an origin
      # that is not listed is rejected before it reaches a handler, which reads
      # as a broken sign-in rather than as a missing setting.
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-lift://}
      PORT: 3000
    expose:
      - '3000'
    networks:
      - dokploy-network

  # The same app as the phone build, exported for a browser and served as static
  # files. See apps/mobile/Dockerfile, and the "Desktop web" section of the
  # README for the two things about this build that are not obvious.
  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        # A build arg rather than an environment variable, because that is what
        # it is: Metro substitutes `EXPO_PUBLIC_*` into the bundle at build
        # time. Changing this means rebuilding the image — restarting the
        # container with a new value does nothing at all.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?set EXPO_PUBLIC_API_URL to the API's public URL}
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - dokploy-network

  # The marketing page. Nothing else in this stack depends on it, and it depends
  # on nothing here — deploying it cannot take the app down, and the app being
  # down does not take it down.
  #
  # A Node server rather than a directory of static files, which is the one way
  # it differs from `web`. The download button shows the version and size of the
  # release GitHub is currently serving, read from GitHub's API and revalidated
  # hourly; an export would freeze that at whatever was true when the image was
  # built. See apps/landing/lib/release.ts.
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        # A build arg rather than an environment variable, because that is what
        # it is: `NEXT_PUBLIC_*` is substituted into the bundle by the compiler.
        # Changing this means rebuilding the image — restarting the container
        # with a new value does nothing at all.
        #
        # This is the landing page's *own* public URL, the one people will type,
        # and it is what the social card's image URL is resolved against. Unset
        # or wrong and the page still looks perfect while every share preview
        # comes back blank.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL to the landing page's public URL}
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - dokploy-network

networks:
  # Traefik's network, and the one Dokploy's database services sit on. The API
  # has to join it both to be routable and to resolve the database host.
  dokploy-network:
    external: true
