# Production stack for Dokploy. Set the Compose Path to this file, not to
# docker-compose.yml — that one is the local development stack and publishes
# both services on host ports, which on a shared server means fighting whatever
# else is on :3000 and putting Postgres on the public internet.
#
# Nothing here is published. Traefik reaches the API over dokploy-network, and
# Postgres is reachable only from the API.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lift
      # No default. A database that falls back to a known password is worse
      # than one that refuses to start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: lift
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The API's own healthcheck depends on this being genuinely ready, not
      # merely started — Postgres accepts connections briefly during init.
      test: ['CMD-SHELL', 'pg_isready -U lift -d lift']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Keep POSTGRES_PASSWORD alphanumeric: it is interpolated into a URL, and
      # a `@` or `/` in it would be read as structure rather than password.
      DATABASE_URL: postgres://lift:${POSTGRES_PASSWORD}@postgres:5432/lift
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      # Must match the domain exactly, scheme included — cookies and OAuth
      # callbacks are derived from it.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-lift://}
      PORT: 3000
    expose:
      - '3000'
    networks:
      - default
      - dokploy-network

volumes:
  postgres-data:

networks:
  # Traefik's network. Dokploy creates it; the API has to join it before a
  # domain can route anywhere. Postgres deliberately stays off it.
  dokploy-network:
    external: true
